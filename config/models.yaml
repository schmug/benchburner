# ── OpenRouter (hosted frontier models via OpenAI-compatible shim) ──
# OpenRouter auto-identifies requests with HTTP-Referer / X-Title set
# by the HTTPAdapter when it sees the openrouter.ai host.
# Set OPENROUTER_API_KEY in .env before running.

- id: claude-opus-4.7
  adapter: http
  endpoint: https://openrouter.ai/api
  api_key_env: OPENROUTER_API_KEY
  context_window: 200000
  model_name: anthropic/claude-opus-4.7

- id: claude-sonnet-4.6
  adapter: http
  endpoint: https://openrouter.ai/api
  api_key_env: OPENROUTER_API_KEY
  context_window: 200000
  model_name: anthropic/claude-sonnet-4.6

- id: claude-haiku-4.5
  adapter: http
  endpoint: https://openrouter.ai/api
  api_key_env: OPENROUTER_API_KEY
  context_window: 200000
  model_name: anthropic/claude-haiku-4.5

- id: gpt-5.4
  adapter: http
  endpoint: https://openrouter.ai/api
  api_key_env: OPENROUTER_API_KEY
  context_window: 1050000
  model_name: openai/gpt-5.4

- id: gpt-5.3-codex
  adapter: http
  endpoint: https://openrouter.ai/api
  api_key_env: OPENROUTER_API_KEY
  context_window: 400000
  model_name: openai/gpt-5.3-codex

