# Model registry. Adding a model here is the only code-free way to plug
# a new orchestrator or subagent into the harness. SPEC §6.
#
# Each entry keys by `id`, which is what `config/run.yaml` references
# under `orchestrator.model` and `subagent_roster[]`.

- id: llama3:8b
  adapter: ollama
  endpoint: http://localhost:11434
  context_window: 8192
  # Ollama uses its own model name format; pass it through as `model`
  # on the invoke() call.
  model_name: llama3:8b

- id: qwen2.5-coder:7b
  adapter: ollama
  endpoint: http://localhost:11434
  context_window: 32768
  model_name: qwen2.5-coder:7b

