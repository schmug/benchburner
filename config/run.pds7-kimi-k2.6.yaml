run_id: auto
# PDS7 — 24h validation run, kimi-k2.6 variant.
#
# Mirrors run.pds7-sonnet-4.6.yaml exactly except for the orchestrator
# model. Single-variable A/B vs sonnet so 24h numbers stay comparable;
# subagent stays claude-haiku-4.5.
#
# Three reasoning-model knobs, raised together (PRs #23, #24, #25):
#
#   - hang_timeout_seconds: 1800 (PR #25 territory) — the harness's
#     "orchestrator hung" detector counts wall-clock since the last
#     completed cycle. With Kimi K2.6's reasoning trace, normal
#     cycles approach 600s as delegation_history fills (observed
#     mean of cycles 7-10: 519s on the v3 attempt). The default
#     600 detector thus reliably kills any otherwise-healthy
#     reasoning-model run after a few hours. 1800 gives the
#     reasoning trace room AND keeps the watchdog meaningful for
#     true hangs. Issue #25 proposes auto-bumping this whenever
#     per_cycle_timeout_seconds is set — until that lands, raise
#     by hand here.
#
#   - per_cycle_timeout_seconds: 1200 (PR #24, opt-in knob from #20).
#     Hard cap on a single orchestrator inference call. Must be
#     STRICTLY less than hang_timeout_seconds, otherwise the hang
#     detector fires before the per-call deadline and the per-call
#     deadline is dead code (this was the v3 failure mode). 1200 <
#     1800 satisfies the implicit invariant.
#
#   - max_completion_tokens: 32768 on the kimi-k2.6 model entry in
#     models.yaml (PR #23, opt-in from #22). Kimi's chain-of-thought
#     trace counts against the same budget as the visible answer;
#     the harness default 4096 frequently exhausts before any content
#     is emitted, returning content="" with finish_reason="length".
#
# Seed: 8675309 — same as every other validation run.
#
# OpenRouter slug: moonshotai/kimi-k2.6 ($0.74/M in / $3.49/M out).

orchestrator:
  model: kimi-k2.6
  polling_interval_seconds: 60
  history_window: 10
  hang_timeout_seconds: 1800
  per_cycle_timeout_seconds: 1200
subagent_roster: [claude-haiku-4.5]
subagent_limits: { max_concurrent: 2, token_budget_per_instruction: 2000, timeout_seconds: 300 }
game: { bitburner_commit: a4b0f22a2e5bcf19826c0bb671373c755fc162ad, seed: 8675309 }
duration_hours: 24
attribution_mode: public
