# Per-run config. Copy to config/run.yaml and edit per the smoke-test
# recipe in HANDOFF.md §"Smoke Test Recipe". SPEC §10.1.
#
# The seed is stored in the DB and in the pinned leaderboard hash, but
# the harness guarantees it never appears in any prompt shown to the
# orchestrator model. Keeping the seed opaque avoids seed-specific
# overfitting — see CLAUDE.md § "Core Constraints" #6.

run_id: auto                        # "auto" → generate UUID at run start

orchestrator:
  model: llama3:8b                  # must match an id in config/models.yaml
  polling_interval_seconds: 60
  history_window: 10                # last-N cycles verbatim in context
  hang_timeout_seconds: 600         # fail the run if no decision for 10 min
  # per_cycle_timeout_seconds: 900  # OPTIONAL hard ceiling on a single
                                    # orchestrator inference call. Default
                                    # is max(30, hang_timeout * 0.5). Set
                                    # explicitly when running a reasoning
                                    # orchestrator (Kimi K2.6, gpt-oss-
                                    # thinking) whose chain-of-thought
                                    # adds 100s+ to per-call latency
                                    # unrelated to hang detection. Loader
                                    # caps at 3600.

subagent_roster:
  - qwen2.5-coder:7b                # all must match ids in config/models.yaml

subagent_limits:
  max_concurrent: 5
  token_budget_per_instruction: 2000
  timeout_seconds: 300

game:
  bitburner_commit: a4b0f22a2e5bcf19826c0bb671373c755fc162ad  # pinned, mirrored in BITBURNER_COMMIT
  seed: 8675309                     # opaque to the orchestrator model

# Exactly one of duration_minutes / duration_hours is required. Both,
# or neither, is a load error — the ambiguity is what let configs claim
# `duration_hours: 1` while the batteries actually ran 20 minutes via
# the dev-only BENCHBURNER_DURATION_SEC override.
#
# 20 minutes is the CANONICAL measurement duration: every ranked number
# on the leaderboard is a 20m run. Use `duration_hours: 24` only for a
# declared endurance run — see config/run.endurance-24h.example.yaml.
duration_minutes: 20
# snapshot_interval_seconds: 50     # OPTIONAL. Default is duration/24,
                                    # floored at 30s, which reproduces
                                    # the historical hourly cadence on a
                                    # 24h run exactly. Override only to
                                    # deliberately change the
                                    # orchestrator's snapshot channel.
attribution_mode: public            # or 'anonymous'
