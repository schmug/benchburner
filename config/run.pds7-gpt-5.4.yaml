run_id: auto
# PDS7 — 24h stability run.
#
# Orchestrator: gpt-5.4 (hosted via OpenRouter). Chosen over
# gpt-oss:20b because the desktop has a 10GB RTX 3080 and
# gpt-oss:20b's 13.8GB model would partial-offload to CPU,
# slowing inference 3-5x and risking cycle-time blowout over
# 24h. Hosted gpt-5.4 has no GPU dependency and is the 2nd-best
# orchestrator by median ($1838) per PDS6.
#
# Subagent: claude-haiku-4.5. Same as PCS1 / PDS6 so 24h numbers
# are comparable to short-run distribution data.
#
# Seed: 8675309 — same as every other validation run, keeps
# results comparable across phases.
#
# hang_timeout_seconds: 120 — same shorter cap as opus-v2 so a
# stalled hosted call can't eat the entire 24h window.

orchestrator:
  model: gpt-5.4
  polling_interval_seconds: 60
  history_window: 10
  hang_timeout_seconds: 120
subagent_roster: [claude-haiku-4.5]
subagent_limits: { max_concurrent: 2, token_budget_per_instruction: 2000, timeout_seconds: 300 }
game: { bitburner_commit: a4b0f22a2e5bcf19826c0bb671373c755fc162ad, seed: 8675309 }
duration_hours: 24
attribution_mode: public
