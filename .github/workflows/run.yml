# Runs the harness for 24 wall-clock hours on a self-hosted runner.
# Manual dispatch only for now; schedule can be added once the harness
# is validated end-to-end on a clean runner.
#
# Preconditions on the runner:
#   - Node 22+
#   - Ollama daemon (or set BENCHBURNER_* envs to point at an HTTP endpoint)
#   - System Chrome at PUPPETEER_EXECUTABLE_PATH
#   - Models pulled: see config/models.yaml

name: harness-run
on:
  workflow_dispatch:
    inputs:
      config_path:
        description: "Path to run config"
        default: "config/run.yaml"
        required: true

jobs:
  run:
    runs-on: [self-hosted, benchburner]
    timeout-minutes: 1500  # 25h headroom over the 24h window
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply Bitburner patches
        run: |
          cd bitburner/src
          git apply --check ../patches/*.patch
          git apply ../patches/*.patch
      - name: Build Bitburner
        run: |
          cd bitburner/src
          npm install --ignore-scripts
          npx webpack --mode production
      - name: Install harness deps
        run: npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # Guards the home-RAM budget that keeps more than one strategy
      # legal (dispatcher under 4.0 GB, so ns.scp+ns.exec and
      # ns.purchaseServer scripts can still start). Runs before the
      # harness, not after: a regression here makes the run measure a
      # single forced strategy, and finding that out 24 hours later
      # costs a whole run slot. Boots the game, so it can only live on
      # this workflow — ci.yml checks out with `submodules: false` and
      # has no Bitburner build to boot.
      - name: RAM budget guard
        run: npm run smoke:ram-budget

      - name: Run harness
        env:
          # Passed via env to avoid command injection from workflow inputs.
          BENCHBURNER_CONFIG: ${{ inputs.config_path }}
        run: npx tsx harness/index.ts
      - name: Push run artifacts
        if: always()
        run: git push origin HEAD
