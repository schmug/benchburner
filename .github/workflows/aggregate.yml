# Rebuilds the static pages/ site from every orchestrator/* branch's
# latest results, then publishes the output to the results-published
# branch (Cloudflare Pages watches that branch — see README §Deploy).
#
# Runs daily on schedule + manual dispatch. results-published is
# rewritten each run because it's a deploy artifact, not history.
#
# Security: this workflow does not consume any untrusted user input
# (no github.event.* interpolation in run blocks). Branch names come
# from `git for-each-ref` against trusted refs/remotes/origin/.

name: aggregate
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Harvest results from orchestrator/* branches
        # Per-branch shallow clone into a tmpdir, then copy results/.
        # We tried `git ls-tree -r origin/<branch> -- results` against
        # the workspace clone and it returned empty on the runner even
        # though the branch tip + objects were both fetched (works
        # locally). Fresh per-branch clones sidestep whatever runner
        # config makes that read fail.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          mkdir -p results
          # Discover branches via the GitHub API. GITHUB_REPOSITORY is
          # set on every runner; avoids interpolating ${{ }} into the
          # shell command body.
          branches=$(gh api "repos/$GITHUB_REPOSITORY/branches" \
            --paginate --jq '.[] | select(.name | startswith("orchestrator/")) | .name')
          if [ -z "$branches" ]; then
            echo "no orchestrator/* branches found"
            exit 0
          fi
          for branch in $branches; do
            echo "::group::harvest $branch"
            tmpdir=$(mktemp -d)
            if git clone --quiet --depth=1 --branch "$branch" --no-tags \
                 "$REPO_URL" "$tmpdir" 2>/dev/null; then
              if [ -d "$tmpdir/results" ]; then
                # Per-branch run_ids don't collide (uuids).
                cp -R "$tmpdir/results/." results/
                count=$(find "$tmpdir/results" -mindepth 1 -maxdepth 1 -type d | wc -l)
                echo "  ok ($count run dirs)"
              else
                echo "  (no results/ on $branch)"
              fi
            else
              echo "  (clone failed for $branch)"
            fi
            rm -rf "$tmpdir"
            echo "::endgroup::"
          done
          total=$(find results -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "harvested $total run directories total"

      - name: Build leaderboard
        run: npx tsx aggregator/build.ts

      - name: Publish pages/ to results-published
        env:
          GIT_AUTHOR_NAME: benchburner-aggregator
          GIT_AUTHOR_EMAIL: aggregator@users.noreply.github.com
          GIT_COMMITTER_NAME: benchburner-aggregator
          GIT_COMMITTER_EMAIL: aggregator@users.noreply.github.com
        run: |
          set -euo pipefail
          PUBLISH_DIR="$RUNNER_TEMP/published"

          # Use a worktree so we can rsync pages/ contents in without
          # touching the main checkout.
          if git ls-remote --exit-code --heads origin results-published >/dev/null 2>&1; then
            git fetch origin results-published:results-published
            git worktree add "$PUBLISH_DIR" results-published
            # Clear everything except .git so removed files actually drop.
            find "$PUBLISH_DIR" -maxdepth 1 -mindepth 1 ! -name '.git' -exec rm -rf {} +
          else
            git worktree add --orphan -b results-published "$PUBLISH_DIR"
          fi

          cp -R pages/. "$PUBLISH_DIR/"

          cd "$PUBLISH_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          git commit -m "aggregate: rebuild leaderboard $(date -u +%FT%TZ)"
          git push origin results-published
