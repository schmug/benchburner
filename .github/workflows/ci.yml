# PR-triggered checks. Cheap, no game boot, no self-hosted runner.
#
# Today this runs the time-awareness smoke (standalone, no Bitburner).
# Other smokes (e.g. harness/game/rfa-smoke.ts) require a live Puppeteer-
# backed game and belong on the self-hosted runner via run.yml, not here.
#
# Security: this workflow consumes no untrusted user input — no
# github.event.* interpolation in run blocks. Safe by construction.

name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `recursive`, not `false`: test/orchestrator/docs-prompt.test.ts
      # calls loadDocs directly to prove the orchestrator really is handed
      # the game's own Basic Mechanics text. Without the submodule that
      # test cannot run, and the alternative — skipping it when the doc
      # tree is absent — would leave that claim enforced by nothing.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Typecheck
        run: npm run typecheck

      # Was previously absent because `npm test` was `... || true` against
      # a dist/ path that never existed — it could not fail, so gating on
      # it was pointless. It reports real failures now.
      - name: Unit tests
        run: npm test

      - name: Time-awareness smoke
        run: npm run smoke:time-awareness
